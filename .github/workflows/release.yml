name: Publish staged playerd binaries
on:
  push:
    branches: ["release/**"]
permissions:
  contents: write
concurrency:
  group: binbox-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate branch, files and checksums
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${BRANCH#release/}"
          [[ "$TAG" =~ ^playerd-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release branch"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Only these fixed binary names are accepted; reject arbitrary SHA256SUMS paths.
          python3 - <<'PY'
          import re
          from pathlib import Path
          names = []
          for line in Path("SHA256SUMS").read_text().splitlines():
              match = re.fullmatch(r"([a-fA-F0-9]{64}) [ *](playerd\.exe|playerd-linux-x64|playerd-linux-arm64)", line)
              if not match: raise SystemExit("Invalid SHA256SUMS entry")
              names.append(match[2])
          if sorted(names) != sorted(["playerd.exe", "playerd-linux-x64", "playerd-linux-arm64"]):
              raise SystemExit("Missing or duplicate SHA256SUMS entry")
          PY
          sha256sum --check --strict SHA256SUMS
          git fetch --depth 1 origin main
          echo "MAIN_TARGET=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - name: Create release once, targeting main (never binary commit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to reuse an unexpected target."
            exit 1
          fi
          gh release create "$TAG" playerd.exe playerd-linux-x64 playerd-linux-arm64 SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$MAIN_TARGET" --title "playerd ${TAG#playerd-v}" \
            --notes "Public self-contained playerd binaries. Verify downloads against SHA256SUMS. No GitHub sign-in required."
      - name: Generate public manifest from published asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/release.json"));
          const repository=process.env.GITHUB_REPOSITORY,tag=process.env.TAG,base=`https://github.com/${repository}/releases`;
          if(r.tag_name!==tag||r.draft||r.prerelease||r.html_url!==`${base}/tag/${tag}`)throw Error("Unexpected release");
          const sums=fs.readFileSync("SHA256SUMS","utf8").trim().split("\n");
          const assets=Object.entries({"playerd.exe":["windows","x64"],"playerd-linux-x64":["linux","x64"],"playerd-linux-arm64":["linux","arm64"]}).map(([name,[os,arch]])=>{
            const matches=r.assets.filter(a=>a.name===name),sum=sums.map(l=>/^([a-fA-F0-9]{64}) [ *](.+)$/.exec(l.trimEnd())).filter(m=>m&&m[2]===name);
            if(matches.length!==1||sum.length!==1)throw Error("Missing/duplicate asset or checksum");
            const a=matches[0];
            if(a.state!=="uploaded"||!Number.isSafeInteger(a.size)||a.size<=0||a.browser_download_url!==`${base}/download/${tag}/${name}`||
               a.digest!==`sha256:${sum[0][1].toLowerCase()}`)throw Error("Digest/metadata mismatch: "+name);
            return {os,arch,name,url:a.browser_download_url,sha256:a.digest.slice(7),size:a.size};
          });
          fs.writeFileSync("playerd-release.json",JSON.stringify({version:tag.slice(9),tag,repository,private:false,releaseUrl:r.html_url,source:`https://api.github.com/repos/${repository}/releases/tags/${tag}`,digestSource:"GitHub release asset digest API",assets},null,2)+"\n");
          JS
          # Never use --clobber. A rerun finds the existing release and fails before here.
          gh release upload "$TAG" playerd-release.json --repo "$GITHUB_REPOSITORY"
      - name: Delete consumed binary branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          current=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          [[ "$current" == "$GITHUB_SHA" ]] || { echo "::error::Release branch moved; refusing to delete"; exit 1; }
          git push origin --delete "$BRANCH"
